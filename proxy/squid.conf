# The sandbox's only web door. Policy lives here; DOMAINS DO NOT.
#
# How it works: the dev container has NO direct internet route. Every outbound
# request must go through this proxy (tools pick it up from the HTTP_PROXY /
# HTTPS_PROXY env vars set in docker-compose.yml). For HTTPS the proxy only
# sees the HOSTNAME being connected to (the URL path is inside the TLS tunnel),
# so rules are per-domain — you cannot whitelist "domain.com/some/path".
#
# ---- Where the domains are now ----------------------------------------------
# This file used to carry an "ACTIVE whitelist" that applied to EVERY sandbox:
# npm, PyPI, models.dev, Adoptium, Gradle, Maven Central, the GitHub download
# hosts, NuGet and the Anthropic domains — all of them open for a project that
# needed one of them. A .NET project running Claude Code does not need npm, and a
# whitelist is only worth what its smallest entry costs.
#
# So the only `allowed` rule left is the include below, and the list it reads is
# built PER PROJECT:
#
#   airlock   composes <control dir>/whitelist.txt out of proxy/whitelist.d/ —
#             the blocks for the project's STACK, the one block for its HARNESS,
#             its own WHITELIST= domains —
#             and points EXTRA_WHITELIST at it.
#   raw callers (bin/harness, no project config) get the default file,
#             proxy/extra-whitelist.txt: what STACK=base needs (npm + PyPI), or
#             whatever list they point EXTRA_WHITELIST at.
#
# Add a domain to a BLOCK (proxy/whitelist.d/stack-*.txt, harness-*.txt) when it is
# a property of a stack or a harness; add it to a PROJECT's WHITELIST= when it is a
# property of that project (a corporate Artifactory, an internal index).
#
# Syntax of those files: one domain per line, `#` comments and blank lines allowed.
# A leading dot means "this domain AND all its subdomains".
#   .npmjs.org   matches npmjs.org, registry.npmjs.org, ...
#
# To load a changed whitelist:
#   airlock reload-proxy                (airlock does this automatically when the
#                                        generated list changed since last launch)
#   docker compose up -d --force-recreate proxy    (raw callers)
#
# To find out what is being blocked (e.g. an install mysteriously fails):
#   airlock denied          (or: docker compose exec proxy grep TCP_DENIED /var/log/squid/access.log)
# The denied hostname is right there in the log line — add it to the right block or
# to the project's WHITELIST= if it is legitimate.

http_port 3128

# ---- THE whitelist ----------------------------------------------------------
# The composed per-project list (airlock) or proxy/extra-whitelist.txt (raw
# callers). This is the only source of allowed domains; there is deliberately no
# second, always-on list next to it that a project could forget it is carrying.
acl allowed dstdomain "/etc/squid/extra-whitelist.txt"

# ---- Policy: allow the list above, deny everything else ---------------------
acl SSL_ports port 443
http_access deny CONNECT !SSL_ports    # HTTPS tunnels only to port 443
http_access allow allowed
http_access deny all                   # default deny — this line is the sandbox

access_log daemon:/var/log/squid/access.log
cache deny all
